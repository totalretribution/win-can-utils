name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: gcc:u make:u

      - name: Build
        shell: msys2 {0}
        run: make

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            candump.exe
            cangen.exe
            cansend.exe
            wincan.exe
