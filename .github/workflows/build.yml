name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make

      - name: Configure
        shell: msys2 {0}
        run: >
          cmake -B build -G "MinGW Makefiles"
          -DCMAKE_BUILD_TYPE=Release
          -DWINCAN_BUILD_TOOLS=ON
          -DWINCAN_VERSION=${{ github.ref_name }}

      - name: Build
        shell: msys2 {0}
        run: cmake --build build

      - name: Package tools
        shell: pwsh
        run: >
          Compress-Archive
          -Path build/candump.exe,build/cangen.exe,build/cansend.exe,build/canboth.exe
          -DestinationPath win-can-utils-${{ github.ref_name }}.zip

      - name: Package library
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path wincan-lib/include/wincan | Out-Null
          Copy-Item include/wincan/wincan.h wincan-lib/include/wincan/
          Copy-Item build/libwincanlib.a    wincan-lib/
          Compress-Archive -Path wincan-lib/* -DestinationPath wincan-lib-${{ github.ref_name }}.zip

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            win-can-utils-${{ github.ref_name }}.zip
            wincan-lib-${{ github.ref_name }}.zip
