name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make

      - name: Build
        shell: msys2 {0}
        run: mingw32-make VERSION=${{ github.ref_name }}

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path candump.exe,cangen.exe,cansend.exe,wincan.exe -DestinationPath win-can-utils-${{ github.ref_name }}.zip

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: win-can-utils-${{ github.ref_name }}.zip
